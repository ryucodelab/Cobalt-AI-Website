<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>CobaltAI — Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #0B0F17;
            font-family: 'Inter', sans-serif;
            color: #E9EDF6;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass {
            background: rgba(255,255,255,0.045);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.09);
        }
        .glass-strong {
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.09);
        }
        .input-dark {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            color: #E9EDF6;
            transition: border-color 0.2s;
        }
        .input-dark:focus {
            outline: none;
            border-color: #3D6BFF;
            box-shadow: 0 0 0 3px rgba(61,107,255,0.2);
        }
        .input-dark::placeholder { color: #5C6980; }
        .btn-primary {
            background: linear-gradient(135deg, #3D6BFF, #22E1FF);
            box-shadow: 0 6px 18px -4px rgba(61,107,255,0.55);
            transition: transform 0.12s, box-shadow 0.12s;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 22px -4px rgba(34,225,255,0.6); }
        .btn-primary:active { transform: scale(0.98); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .link-cyan { color: #22E1FF; }
        .link-cyan:hover { color: #6C8CFF; text-decoration: underline; }
        .error-text { color: #EF4444; font-size: 13px; margin-top: 4px; }
        .success-text { color: #22C55E; font-size: 13px; margin-top: 4px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- ====== AURORA BACKGROUND ====== -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <div class="absolute rounded-full blur-[90px] opacity-30 w-[520px] h-[520px] top-[-180px] left-[-120px] bg-[#3D6BFF] animate-pulse"></div>
        <div class="absolute rounded-full blur-[90px] opacity-30 w-[460px] h-[460px] bottom-[-160px] right-[-100px] bg-[#7C6CFF] animate-pulse" style="animation-delay: 2s;"></div>
        <div class="absolute rounded-full blur-[90px] opacity-20 w-[380px] h-[380px] top-[35%] left-[45%] bg-[#22E1FF] animate-pulse" style="animation-delay: 4s;"></div>
    </div>

    <!-- ====== MAIN CARD ====== -->
    <div class="relative z-10 w-full max-w-md px-4 py-6">
        <div class="glass rounded-3xl p-8 shadow-2xl">

            <!-- LOGO -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center gap-2.5">
                    <div class="flex h-10 w-10 items-center justify-center rounded-xl" style="background:linear-gradient(135deg,#3D6BFF,#22E1FF);box-shadow:0 0 24px rgba(34,225,255,0.3);">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" fill="#06101f"/></svg>
                    </div>
                    <span class="text-2xl font-bold tracking-tight" style="font-family:'Plus Jakarta Sans',sans-serif;">Cobalt<span style="color:#22E1FF;">AI</span></span>
                </div>
                <p class="text-sm text-[#92A0B8] mt-2" id="pageSubtitle">Masuk untuk melanjutkan</p>
            </div>

            <!-- ====== LOGIN FORM ====== -->
            <div id="loginForm">
                <form id="loginFormElement" onsubmit="return handleLogin(event)">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-[#92A0B8] mb-1.5">Username</label>
                            <input type="text" id="loginUsername" placeholder="Masukkan username" class="input-dark w-full rounded-xl px-4 py-3 text-sm" required />
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-[#92A0B8] mb-1.5">Password</label>
                            <input type="password" id="loginPassword" placeholder="Masukkan password" class="input-dark w-full rounded-xl px-4 py-3 text-sm" required />
                        </div>
                    </div>
                    <div id="loginError" class="error-text hidden mt-3"></div>
                    <button type="submit" id="loginBtn" class="btn-primary w-full rounded-xl py-3.5 text-sm font-semibold text-[#06101f] mt-6 transition">
                        Masuk
                    </button>
                </form>
                <p class="text-center text-sm text-[#5C6980] mt-4">
                    Belum punya akun?
                    <button type="button" onclick="showRegister()" class="link-cyan bg-transparent border-0 cursor-pointer font-medium text-sm">
                        Daftar
                    </button>
                </p>
            </div>

            <!-- ====== REGISTER FORM ====== -->
            <div id="registerForm" class="hidden">
                <form id="registerFormElement" onsubmit="return handleRegister(event)">
                    <div class="space-y-3.5">
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-sm font-medium text-[#92A0B8] mb-1.5">Nama Depan</label>
                                <input type="text" id="regFirstName" placeholder="Nama depan" class="input-dark w-full rounded-xl px-4 py-3 text-sm" required />
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-[#92A0B8] mb-1.5">Nama Belakang</label>
                                <input type="text" id="regLastName" placeholder="Nama belakang" class="input-dark w-full rounded-xl px-4 py-3 text-sm" required />
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-[#92A0B8] mb-1.5">Username</label>
                            <input type="text" id="regUsername" placeholder="Pilih username" class="input-dark w-full rounded-xl px-4 py-3 text-sm" required />
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-[#92A0B8] mb-1.5">Password</label>
                            <input type="password" id="regPassword" placeholder="Minimal 6 karakter" class="input-dark w-full rounded-xl px-4 py-3 text-sm" required minlength="6" />
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-[#92A0B8] mb-1.5">Konfirmasi Password</label>
                            <input type="password" id="regConfirmPassword" placeholder="Ulangi password" class="input-dark w-full rounded-xl px-4 py-3 text-sm" required />
                        </div>
                    </div>
                    <div id="registerError" class="error-text hidden mt-3"></div>
                    <div id="registerSuccess" class="success-text hidden mt-3"></div>

                    <!-- PERINGATAN -->
                    <div class="mt-4 p-3 rounded-xl text-xs" style="background:rgba(239,68,68,0.08); border:1px solid rgba(239,68,68,0.2); color:#FCA5A5;">
                        ⚠️ <strong>Tidak ada verifikasi email.</strong> Simpan baik-baik username dan password Anda!
                    </div>

                    <button type="submit" id="registerBtn" class="btn-primary w-full rounded-xl py-3.5 text-sm font-semibold text-[#06101f] mt-4 transition">
                        Daftar
                    </button>
                </form>
                <p class="text-center text-sm text-[#5C6980] mt-4">
                    Sudah punya akun?
                    <button type="button" onclick="showLogin()" class="link-cyan bg-transparent border-0 cursor-pointer font-medium text-sm">
                        Masuk
                    </button>
                </p>
            </div>

        </div>
    </div>

    <script>
        // ====== DOM REFS ======
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const loginError = document.getElementById('loginError');
        const registerError = document.getElementById('registerError');
        const registerSuccess = document.getElementById('registerSuccess');
        const pageSubtitle = document.getElementById('pageSubtitle');

        // ====== SHOW/HIDE ======
        function showRegister() {
            loginForm.classList.add('hidden');
            registerForm.classList.remove('hidden');
            pageSubtitle.textContent = 'Buat akun CobaltAI';
            loginError.classList.add('hidden');
            registerError.classList.add('hidden');
            registerSuccess.classList.add('hidden');
        }

        function showLogin() {
            registerForm.classList.add('hidden');
            loginForm.classList.remove('hidden');
            pageSubtitle.textContent = 'Masuk untuk melanjutkan';
            loginError.classList.add('hidden');
            registerError.classList.add('hidden');
            registerSuccess.classList.add('hidden');
        }

        // ====== HANDLE LOGIN ======
        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const btn = document.getElementById('loginBtn');
            const errorEl = document.getElementById('loginError');

            if (!username || !password) {
                errorEl.textContent = 'Username dan password wajib diisi';
                errorEl.classList.remove('hidden');
                return false;
            }

            btn.disabled = true;
            btn.textContent = '⏳ Memproses...';
            errorEl.classList.add('hidden');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Login gagal');
                }

                // Simpan token
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                // Redirect ke chat
                window.location.href = '/chat';

            } catch (error) {
                errorEl.textContent = error.message;
                errorEl.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = 'Masuk';
            }

            return false;
        }

        // ====== HANDLE REGISTER ======
        async function handleRegister(e) {
            e.preventDefault();
            const firstName = document.getElementById('regFirstName').value.trim();
            const lastName = document.getElementById('regLastName').value.trim();
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            const btn = document.getElementById('registerBtn');
            const errorEl = document.getElementById('registerError');
            const successEl = document.getElementById('registerSuccess');

            // Validasi
            if (!firstName || !lastName || !username || !password || !confirmPassword) {
                errorEl.textContent = 'Semua field wajib diisi';
                errorEl.classList.remove('hidden');
                successEl.classList.add('hidden');
                return false;
            }

            if (username.length < 3) {
                errorEl.textContent = 'Username minimal 3 karakter';
                errorEl.classList.remove('hidden');
                successEl.classList.add('hidden');
                return false;
            }

            if (password.length < 6) {
                errorEl.textContent = 'Password minimal 6 karakter';
                errorEl.classList.remove('hidden');
                successEl.classList.add('hidden');
                return false;
            }

            if (password !== confirmPassword) {
                errorEl.textContent = 'Password dan konfirmasi password tidak cocok';
                errorEl.classList.remove('hidden');
                successEl.classList.add('hidden');
                return false;
            }

            btn.disabled = true;
            btn.textContent = '⏳ Mendaftar...';
            errorEl.classList.add('hidden');
            successEl.classList.add('hidden');

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username, 
                        password,
                        first_name: firstName,
                        last_name: lastName
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Registrasi gagal');
                }

                // Simpan token
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                // Tampilkan sukses
                successEl.textContent = '✅ Registrasi berhasil! Mengalihkan...';
                successEl.classList.remove('hidden');

                // Redirect setelah 1.5 detik
                setTimeout(() => {
                    window.location.href = '/chat';
                }, 1500);

            } catch (error) {
                errorEl.textContent = error.message;
                errorEl.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = 'Daftar';
            }

            return false;
        }

        // ====== CEK TOKEN SAAT LOAD ======
        document.addEventListener('DOMContentLoaded', function() {
            const token = localStorage.getItem('token');
            if (token) {
                // Coba verify token
                fetch('/api/auth/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                })
                .then(res => {
                    if (res.ok) {
                        window.location.href = '/chat';
                    } else {
                        localStorage.removeItem('token');
                        localStorage.removeItem('user');
                    }
                })
                .catch(() => {
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                });
            }
        });
    </script>

</body>
</html>
