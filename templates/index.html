<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CobaltAI — Setup</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: #0B0F17;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #E9EDF6;
            padding: 20px;
        }
        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 40px 32px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 24px 64px rgba(0,0,0,0.5);
        }
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .logo h1 span { color: #22E1FF; }
        .logo p {
            color: #92A0B8;
            font-size: 14px;
            margin-top: 4px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #92A0B8;
            margin-bottom: 6px;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #E9EDF6;
            font-size: 14px;
            transition: border-color 0.2s;
            outline: none;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: #3D6BFF;
            box-shadow: 0 0 0 3px rgba(61,107,255,0.2);
        }
        .form-group input::placeholder {
            color: #5C6980;
        }
        .form-group select option {
            background: #1a1f2e;
            color: #E9EDF6;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #3D6BFF, #22E1FF);
            color: #06101f;
            transition: transform 0.12s, box-shadow 0.12s;
            margin-top: 6px;
        }
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(34,225,255,0.3);
        }
        .btn:active { transform: scale(0.98); }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .error {
            color: #EF4444;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }
        .success {
            color: #22C55E;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }
        .hint {
            font-size: 11px;
            color: #5C6980;
            margin-top: 14px;
            text-align: center;
        }
        .hint a {
            color: #22E1FF;
            text-decoration: none;
        }
        .hint a:hover { text-decoration: underline; }
        .warning {
            margin-top: 16px;
            padding: 12px;
            background: rgba(239,68,68,0.08);
            border: 1px solid rgba(239,68,68,0.15);
            border-radius: 10px;
            font-size: 12px;
            color: #FCA5A5;
        }
        .warning strong { color: #EF4444; }
    </style>
</head>
<body>

<div class="card">
    <div class="logo">
        <h1>Cobalt<span>AI</span></h1>
        <p>Masukkan API Key untuk mulai</p>
    </div>

    <form id="setupForm">
        <div class="form-group">
            <label>🔑 OpenRouter API Key</label>
            <input 
                type="password" 
                id="apiKey" 
                placeholder="sk-or-v1-xxxxx" 
                required 
            />
        </div>

        <div class="form-group">
            <label>🧠 Model</label>
            <select id="model">
                <option value="mistralai/mistral-7b-instruct:free">Mistral 7B (Free)</option>
                <option value="meta-llama/llama-3.2-3b-instruct:free">Llama 3.2 3B (Free)</option>
                <option value="google/gemini-2.0-flash-exp:free">Gemini 2.0 Flash (Free)</option>
                <option value="microsoft/phi-3-mini-128k-instruct:free">Phi-3 Mini (Free)</option>
                <option value="qwen/qwen-2.5-72b-instruct">Qwen 2.5 72B</option>
                <option value="openai/gpt-4o">GPT-4o</option>
                <option value="anthropic/claude-3.5-sonnet">Claude 3.5 Sonnet</option>
                <option value="openai/o3-mini">OpenAI o3-mini</option>
                <option value="deepseek/deepseek-r1">DeepSeek R1</option>
            </select>
        </div>

        <div id="errorMessage" class="error"></div>
        <div id="successMessage" class="success"></div>

        <button type="submit" id="setupBtn" class="btn">🚀 Mulai Chat</button>

        <div class="warning">
            ⚠️ <strong>Catatan:</strong> API Key disimpan di browser Anda. Jangan bagikan ke siapa pun!
        </div>

        <div class="hint">
            Belum punya? <a href="https://openrouter.ai/keys" target="_blank">Dapatkan di sini</a>
        </div>
    </form>
</div>

<script>
    const form = document.getElementById('setupForm');
    const apiKeyInput = document.getElementById('apiKey');
    const modelSelect = document.getElementById('model');
    const errorMsg = document.getElementById('errorMessage');
    const successMsg = document.getElementById('successMessage');
    const btn = document.getElementById('setupBtn');

    // Cek apakah udah ada setup sebelumnya
    document.addEventListener('DOMContentLoaded', function() {
        const savedKey = localStorage.getItem('openrouter_api_key');
        const savedModel = localStorage.getItem('openrouter_model');
        if (savedKey && savedModel) {
            window.location.href = '/chat';
        }
    });

    form.addEventListener('submit', async function(e) {
        e.preventDefault();

        const apiKey = apiKeyInput.value.trim();
        const model = modelSelect.value;

        // Validasi
        if (!apiKey) {
            errorMsg.textContent = '⚠️ API Key tidak boleh kosong!';
            errorMsg.style.display = 'block';
            successMsg.style.display = 'none';
            return;
        }

        if (!apiKey.startsWith('sk-') && !apiKey.startsWith('sk-or-v1-')) {
            errorMsg.textContent = '⚠️ Format API Key tidak valid. Cek dari OpenRouter.';
            errorMsg.style.display = 'block';
            successMsg.style.display = 'none';
            return;
        }

        // Disable button
        btn.disabled = true;
        btn.textContent = '⏳ Memeriksa...';
        errorMsg.style.display = 'none';
        successMsg.style.display = 'none';

        try {
            // Test API Key
            const testRes = await fetch('https://openrouter.ai/api/v1/auth/key', {
                headers: { 'Authorization': `Bearer ${apiKey}` }
            });

            if (!testRes.ok) {
                throw new Error('API Key tidak valid. Cek kembali.');
            }

            // Simpan ke localStorage
            localStorage.setItem('openrouter_api_key', apiKey);
            localStorage.setItem('openrouter_model', model);

            successMsg.textContent = '✅ Setup berhasil! Mengalihkan...';
            successMsg.style.display = 'block';

            setTimeout(() => {
                window.location.href = '/chat';
            }, 1200);

        } catch (err) {
            errorMsg.textContent = '❌ ' + err.message;
            errorMsg.style.display = 'block';
            btn.disabled = false;
            btn.textContent = '🚀 Mulai Chat';
        }
    });
</script>

</body>
</html>
