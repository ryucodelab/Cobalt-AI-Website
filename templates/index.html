<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CobaltAI — Asisten AI Cerdas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
               1. ROOT VARIABLES & RESET
               ============================================================ */
        :root {
            --bg: #0B0F17;
            --bg-panel: #10151F;
            --glass: rgba(255, 255, 255, 0.045);
            --glass-strong: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.09);
            --cobalt: #3D6BFF;
            --cobalt-2: #6C8CFF;
            --cyan: #22E1FF;
            --violet: #7C6CFF;
            --text-1: #E9EDF6;
            --text-2: #92A0B8;
            --text-3: #5C6980;
            --radius: 12px;
            --radius-lg: 20px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text-1);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .font-display {
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
        }

        /* ============================================================
               2. AURORA BACKGROUND
               ============================================================ */
        .aurora {
            position: fixed;
            border-radius: 9999px;
            filter: blur(90px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.35;
            animation: drift 22s ease-in-out infinite alternate;
        }

        .aurora-1 {
            width: 520px;
            height: 520px;
            top: -180px;
            left: -120px;
            background: radial-gradient(circle, var(--cobalt), transparent 70%);
        }

        .aurora-2 {
            width: 460px;
            height: 460px;
            bottom: -160px;
            right: -100px;
            background: radial-gradient(circle, var(--violet), transparent 70%);
            animation-delay: -8s;
        }

        .aurora-3 {
            width: 380px;
            height: 380px;
            top: 35%;
            left: 45%;
            background: radial-gradient(circle, var(--cyan), transparent 70%);
            opacity: 0.18;
            animation-delay: -14s;
        }

        @keyframes drift {
            0% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(30px, -20px) scale(1.08);
            }
            100% {
                transform: translate(-20px, 15px) scale(0.96);
            }
        }

        /* ============================================================
               3. GLASS UTILITY
               ============================================================ */
        .glass {
            background: var(--glass);
            backdrop-filter: blur(20px) saturate(140%);
            -webkit-backdrop-filter: blur(20px) saturate(140%);
            border: 1px solid var(--glass-border);
        }

        .glass-strong {
            background: var(--glass-strong);
            backdrop-filter: blur(24px) saturate(150%);
            -webkit-backdrop-filter: blur(24px) saturate(150%);
            border: 1px solid var(--glass-border);
        }

        /* ============================================================
               4. SCROLLBAR
               ============================================================ */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* ============================================================
               5. SIDEBAR
               ============================================================ */
        #sidebar {
            width: 280px;
            min-width: 280px;
            transition: transform .32s cubic-bezier(.4, 0, .2, 1), opacity .25s ease;
            border-right: 1px solid var(--glass-border);
            position: relative;
            z-index: 30;
            height: 100vh;
            overflow-y: auto;
            background: var(--bg-panel);
        }

        #sidebar.collapsed {
            transform: translateX(-100%);
            opacity: 0;
        }

        .history-item {
            color: var(--text-2);
            transition: background .15s ease, color .15s ease;
            cursor: pointer;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-1);
        }

        .history-item.active {
            background: linear-gradient(90deg, rgba(61, 107, 255, 0.16), rgba(34, 225, 255, 0.05));
            color: var(--text-1);
            border-left: 2px solid var(--cyan);
        }

        .history-item .truncate {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ============================================================
               6. HEADER
               ============================================================ */
        header.glass {
            border-left: none;
            border-top: none;
            border-right: none;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(11, 15, 23, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-2);
            transition: background .15s ease, color .15s ease, transform .1s ease;
            cursor: pointer;
            background: transparent;
            border: none;
            flex-shrink: 0;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.07);
            color: var(--text-1);
        }

        .icon-btn:active {
            transform: scale(0.94);
        }

        /* ============================================================
               7. BUBBLE CHAT
               ============================================================ */
        .bubble-user {
            background: linear-gradient(135deg, var(--cobalt), var(--cyan) 130%);
            color: #06101f;
            box-shadow: 0 8px 24px -8px rgba(61, 107, 255, 0.45);
        }

        .bubble-bot {
            background: var(--glass-strong);
            backdrop-filter: blur(18px);
            border: 1px solid var(--glass-border);
        }

        .avatar-bot {
            background: radial-gradient(circle at 30% 30%, var(--cyan), var(--cobalt) 70%);
            box-shadow: 0 0 14px rgba(34, 225, 255, 0.35);
            flex-shrink: 0;
        }

        .typing-dot {
            width: 5px;
            height: 5px;
            border-radius: 999px;
            background: var(--text-2);
            animation: blink 1.1s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: .15s;
        }
        .typing-dot:nth-child(3) {
            animation-delay: .3s;
        }

        @keyframes blink {
            0%,
            80%,
            100% {
                opacity: .25;
            }
            40% {
                opacity: 1;
            }
        }

        .msg-in {
            animation: msgIn .35s ease both;
        }

        @keyframes msgIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }

        /* ============================================================
               8. INPUT BAR
               ============================================================ */
        .input-shell {
            position: relative;
            border-radius: 22px;
        }

        .input-shell::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 22px;
            padding: 1px;
            background: linear-gradient(120deg, rgba(61, 107, 255, 0.55), rgba(34, 225, 255, 0.55), rgba(124, 108, 255, 0.4));
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: .55;
            transition: opacity .25s ease;
            pointer-events: none;
            animation: glow-shift 6s linear infinite;
            background-size: 200% 200%;
        }

        .input-shell:focus-within::before {
            opacity: 1;
        }

        @keyframes glow-shift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        textarea#chatInput {
            background: transparent;
            resize: none;
            outline: none;
            color: var(--text-1);
            font-family: 'Inter', sans-serif;
            border: none;
            width: 100%;
            font-size: 14px;
            padding: 8px 0;
            line-height: 1.5;
            min-height: 24px;
            max-height: 160px;
        }

        textarea#chatInput::placeholder {
            color: var(--text-3);
        }

        .send-btn {
            background: linear-gradient(135deg, var(--cobalt), var(--cyan));
            box-shadow: 0 6px 18px -4px rgba(61, 107, 255, 0.55);
            transition: transform .12s ease, box-shadow .12s ease;
            border: none;
            cursor: pointer;
            flex-shrink: 0;
        }

        .send-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 22px -4px rgba(34, 225, 255, 0.6);
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .attach-btn:hover,
        .mic-btn:hover {
            color: var(--cyan);
        }

        /* ============================================================
               9. LOGIN OVERLAY
               ============================================================ */
        #loginOverlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(11, 15, 23, 0.9);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #loginOverlay.hidden {
            display: none;
        }

        .login-card {
            background: var(--bg-panel);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px 32px;
            max-width: 400px;
            width: 90%;
            box-shadow: var(--shadow);
        }

        .login-card input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-1);
            font-size: 14px;
            outline: none;
            transition: border-color .2s;
        }

        .login-card input:focus {
            border-color: var(--cobalt);
        }

        .login-card input::placeholder {
            color: var(--text-3);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--cobalt), var(--cyan));
            color: #06101f;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: transform .12s ease, box-shadow .12s ease;
            box-shadow: 0 6px 18px -4px rgba(61, 107, 255, 0.45);
        }

        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 22px -4px rgba(34, 225, 255, 0.5);
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .login-toggle {
            color: var(--cobalt-2);
            cursor: pointer;
            font-weight: 600;
            transition: color .2s;
        }

        .login-toggle:hover {
            color: var(--cyan);
        }

        .login-error {
            color: #ef4444;
            font-size: 13px;
            text-align: center;
            min-height: 20px;
        }

        /* ============================================================
               10. MOBILE RESPONSIVE
               ============================================================ */
        @media (max-width: 860px) {
            #sidebar {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                z-index: 40;
                width: 280px;
                height: 100vh;
                border-right: 1px solid var(--glass-border);
                transform: translateX(-100%);
                transition: transform .32s cubic-bezier(.4, 0, .2, 1);
                background: var(--bg-panel);
                box-shadow: 4px 0 40px rgba(0, 0, 0, 0.6);
            }

            #sidebar.collapsed {
                transform: translateX(-100%);
            }

            #sidebar:not(.collapsed) {
                transform: translateX(0);
            }

            #sidebarBackdrop {
                position: fixed;
                inset: 0;
                z-index: 35;
                background: rgba(0, 0, 0, 0.6);
                display: none;
            }

            #sidebarBackdrop.show {
                display: block;
            }

            main {
                padding-left: 16px !important;
                padding-right: 16px !important;
                padding-top: 16px !important;
            }

            .login-card {
                padding: 28px 20px;
            }

            #chatTitle {
                font-size: 13px !important;
            }

            header .icon-btn {
                width: 32px;
                height: 32px;
            }

            .bubble-user,
            .bubble-bot {
                max-width: 90% !important;
                font-size: 13px !important;
                padding: 10px 14px !important;
            }

            .input-shell {
                padding: 8px 12px !important;
            }

            textarea#chatInput {
                font-size: 13px !important;
            }

            .send-btn {
                width: 36px !important;
                height: 36px !important;
            }

            .icon-btn {
                width: 32px !important;
                height: 32px !important;
            }

            .floating-input {
                padding-left: 12px !important;
                padding-right: 12px !important;
                padding-bottom: 12px !important;
            }
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 24px 16px;
            }

            .login-card h2 {
                font-size: 20px !important;
            }

            .bubble-user,
            .bubble-bot {
                font-size: 12.5px !important;
                padding: 8px 12px !important;
            }

            .history-item {
                font-size: 12px !important;
                padding: 6px 10px !important;
            }
        }

        /* ============================================================
               11. UTILITY
               ============================================================ */
        .hidden {
            display: none !important;
        }

        .w-full {
            width: 100%;
        }
        .max-w-3xl {
            max-width: 768px;
        }
        .mx-auto {
            margin-left: auto;
            margin-right: auto;
        }

        /* Override tailwind gap */
        .gap-6 {
            gap: 24px;
        }
        .gap-3 {
            gap: 12px;
        }
        .gap-2 {
            gap: 8px;
        }
        .gap-1\.5 {
            gap: 6px;
        }
    </style>
</head>
<body>
