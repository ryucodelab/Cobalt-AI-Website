<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CobaltAI — Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #0B0F17;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #E9EDF6;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 16px 20px;
            background: rgba(255,255,255,0.04);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        header h1 {
            font-size: 18px;
            font-weight: 700;
        }
        header h1 span { color: #22E1FF; }
        header button {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            color: #92A0B8;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        header button:hover {
            background: rgba(255,255,255,0.1);
            color: #E9EDF6;
        }
        #chatArea {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .msg {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg-user {
            align-self: flex-end;
            background: linear-gradient(135deg, #3D6BFF, #22E1FF);
            color: #06101f;
            border-bottom-right-radius: 4px;
        }
        .msg-bot {
            align-self: flex-start;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.06);
            border-bottom-left-radius: 4px;
        }
        .msg-bot .time,
        .msg-user .time {
            font-size: 10px;
            opacity: 0.5;
            margin-top: 4px;
            display: block;
        }
        .typing {
            align-self: flex-start;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.06);
            padding: 12px 18px;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            display: flex;
            gap: 4px;
        }
        .typing span {
            width: 6px;
            height: 6px;
            background: #92A0B8;
            border-radius: 50%;
            animation: dot 1.2s infinite;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dot {
            0%, 60%, 100% { opacity: 0.2; transform: scale(0.8); }
            30% { opacity: 1; transform: scale(1); }
        }
        .input-area {
            padding: 16px 20px;
            background: rgba(255,255,255,0.03);
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }
        .input-area textarea {
            flex: 1;
            padding: 12px 16px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            color: #E9EDF6;
            font-size: 14px;
            outline: none;
            resize: none;
            font-family: inherit;
            min-height: 48px;
            max-height: 120px;
        }
        .input-area textarea:focus {
            border-color: #3D6BFF;
            box-shadow: 0 0 0 3px rgba(61,107,255,0.15);
        }
        .input-area textarea::placeholder {
            color: #5C6980;
        }
        .input-area button {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #3D6BFF, #22E1FF);
            color: #06101f;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .input-area button:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 16px rgba(34,225,255,0.3);
        }
        .input-area button:active { transform: scale(0.97); }
        .input-area button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .empty-state {
            text-align: center;
            margin: auto;
            color: #5C6980;
        }
        .empty-state h2 {
            font-size: 20px;
            color: #E9EDF6;
            margin-bottom: 4px;
        }
        .empty-state p { font-size: 14px; }
        .model-badge {
            font-size: 10px;
            color: #5C6980;
            background: rgba(255,255,255,0.04);
            padding: 2px 10px;
            border-radius: 12px;
        }
    </style>
</head>
<body>

<header>
    <h1>Cobalt<span>AI</span></h1>
    <div style="display:flex;align-items:center;gap:10px;">
        <span id="modelBadge" class="model-badge">Loading...</span>
        <button onclick="resetSetup()">🔄 Ganti Key</button>
    </div>
</header>

<div id="chatArea">
    <div class="empty-state" id="emptyState">
        <h2>💬 Mulai Chat</h2>
        <p>Kirim pesan pertama ke CobaltAI</p>
    </div>
</div>

<div class="input-area">
    <textarea id="chatInput" rows="1" placeholder="Tulis pesan..." oninput="autoGrow(this)"></textarea>
    <button id="sendBtn" onclick="sendMessage()">Kirim</button>
</div>

<script>
    const chatArea = document.getElementById('chatArea');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const emptyState = document.getElementById('emptyState');
    const modelBadge = document.getElementById('modelBadge');

    // Ambil dari localStorage
    const API_KEY = localStorage.getItem('openrouter_api_key');
    const MODEL = localStorage.getItem('openrouter_model') || 'mistralai/mistral-7b-instruct:free';

    let history = [];

    // Cek API Key
    if (!API_KEY) {
        window.location.href = '/';
    }

    modelBadge.textContent = MODEL.split('/')[1] || MODEL;

    function autoGrow(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    function addMessage(role, content) {
        emptyState.style.display = 'none';

        const div = document.createElement('div');
        div.className = `msg msg-${role}`;
        const time = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        div.innerHTML = `${content}<span class="time">${time}</span>`;
        chatArea.appendChild(div);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    function addTyping() {
        const div = document.createElement('div');
        div.className = 'typing';
        div.id = 'typingIndicator';
        div.innerHTML = '<span></span><span></span><span></span>';
        chatArea.appendChild(div);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    function removeTyping() {
        const el = document.getElementById('typingIndicator');
        if (el) el.remove();
    }

    async function sendMessage() {
        const message = chatInput.value.trim();
        if (!message) return;

        // Disable input
        chatInput.disabled = true;
        sendBtn.disabled = true;
        chatInput.value = '';
        chatInput.style.height = 'auto';

        // Tampilkan pesan user
        addMessage('user', message);
        history.push({ role: 'user', content: message });

        // Typing indicator
        addTyping();

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    api_key: API_KEY,
                    model: MODEL,
                    message: message,
                    history: history.slice(0, -1) // history tanpa pesan terakhir
                })
            });

            removeTyping();

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'Gagal mendapatkan respons');
            }

            addMessage('bot', data.response);
            history.push({ role: 'assistant', content: data.response });

        } catch (error) {
            removeTyping();
            addMessage('bot', '❌ ' + error.message);
        }

        chatInput.disabled = false;
        sendBtn.disabled = false;
        chatInput.focus();
    }

    // Enter to send
    chatInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    function resetSetup() {
        localStorage.removeItem('openrouter_api_key');
        localStorage.removeItem('openrouter_model');
        window.location.href = '/';
    }
</script>

</body>
</html>
